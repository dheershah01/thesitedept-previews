<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tysoe Resto Shed | Website preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Hanken+Grotesk:wght@400;500;600;700&family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&family=Jost:wght@400;500;600&family=Young+Serif&family=Figtree:wght@400;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Nunito+Sans:wght@400;600;700&family=Barlow+Condensed:wght@800&family=Barlow:wght@400;500;600;700&family=Archivo:wdth,wght@62..125,900&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* One renderer, six themes (barber, salon, restaurant, cafe, trades, fitness). Theme tokens set on <body data-theme>. */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:84px;background:var(--bg);color:var(--ink);font-family:var(--body)}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:var(--dw);line-height:var(--dlh);text-transform:var(--dtt);letter-spacing:var(--dls);text-wrap:balance}
body[data-theme=barber]{--bg:#F2EFE9;--ink:#151515;--accent:#C8102E;--accent2:#1E3557;--mute:#67635C;--line:#D9D4CA;--card:#FBFAF7;--onaccent:#fff;--display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--dw:900;--dlh:.9;--dtt:uppercase;--dls:0;--body:"Hanken Grotesk",system-ui,sans-serif;--radius:999px;--hero:clamp(56px,15vw,170px);color-scheme:light}
body[data-theme=salon]{--bg:#FBF7F4;--ink:#2A1626;--accent:#C9707F;--accent2:#3B1E35;--mute:#7C6676;--line:#EADCE2;--card:#fff;--onaccent:#fff;--display:"Bodoni Moda",Didot,Georgia,serif;--dw:500;--dlh:1.04;--dtt:none;--dls:0;--body:"Jost",system-ui,sans-serif;--radius:999px;--hero:clamp(44px,8.5vw,88px);color-scheme:light}
body[data-theme=restaurant]{--bg:#12241D;--ink:#F4EFE6;--accent:#F2A93B;--accent2:#1A3329;--mute:#A9B5AD;--line:#2A4339;--card:#1A3329;--onaccent:#12241D;--display:"Young Serif",Georgia,serif;--dw:400;--dlh:1.02;--dtt:none;--dls:0;--body:"Figtree",system-ui,sans-serif;--radius:12px;--hero:clamp(44px,9vw,84px);color-scheme:dark}
body[data-theme=cafe]{--bg:#FFFDF8;--ink:#1D2A3A;--accent:#E84A2F;--accent2:#CFE6F5;--mute:#5A6878;--line:#C9D6E0;--card:#fff;--onaccent:#fff;--display:"Bricolage Grotesque","Trebuchet MS",sans-serif;--dw:800;--dlh:.98;--dtt:none;--dls:-.02em;--body:"Nunito Sans",system-ui,sans-serif;--radius:14px;--hero:clamp(48px,10vw,100px);color-scheme:light}
body[data-theme=trades]{--bg:#0E1B2E;--ink:#F6F7F9;--accent:#FFD400;--accent2:#16273F;--mute:#9FB0C6;--line:#26395A;--card:#16273F;--onaccent:#0E1B2E;--display:"Barlow Condensed","Arial Narrow",sans-serif;--dw:800;--dlh:.92;--dtt:uppercase;--dls:0;--body:"Barlow",system-ui,sans-serif;--radius:8px;--hero:clamp(52px,11vw,116px);color-scheme:dark}
body[data-theme=fitness]{--bg:#F5F5F2;--ink:#0F1114;--accent:#FF5A1F;--accent2:#0F1114;--mute:#5D6168;--line:#DCDCD6;--card:#fff;--onaccent:#fff;--display:"Archivo","Arial Black",sans-serif;--dw:900;--dlh:.95;--dtt:uppercase;--dls:0;--body:"Manrope",system-ui,sans-serif;--radius:10px;--hero:clamp(40px,10vw,116px);color-scheme:light}
body[data-theme=fitness] h1,body[data-theme=fitness] h2,body[data-theme=fitness] h3{font-stretch:125%}
.pv{background:#111;color:#fff;font:600 13px/1.4 system-ui,sans-serif;text-align:center;padding:8px 14px}
.pv b{color:#FF8A5B}
.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1.5px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;height:62px;gap:12px}
.logo{font-family:var(--display);font-weight:var(--dw);text-transform:var(--dtt);font-size:22px;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
.status{font-size:12px;font-weight:600;display:flex;align-items:center;gap:7px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mute)}
.dot.open{background:#1E8E4E;box-shadow:0 0 0 4px rgba(30,142,78,.15)}
.hero{padding-block:36px 40px}
.meta{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px;font-weight:600;color:var(--mute);margin-bottom:16px}
.meta .stars{color:var(--ink)}
.hero h1{font-size:var(--hero);overflow-wrap:break-word}
.hero h1 span{color:var(--accent)}
.lede{max-width:40ch;font-size:19px;margin:20px 0 26px;color:var(--ink);opacity:.9}
.ctas{display:flex;flex-wrap:wrap;gap:10px}
.btn{font:700 16px/1 var(--body);border:1.5px solid var(--ink);border-radius:var(--radius);padding:16px 24px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:transparent;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.band{height:18px;background:var(--accent)}
body[data-theme=barber] .band{height:46px;border-block:1.5px solid var(--ink);background:repeating-linear-gradient(-45deg,var(--accent) 0 22px,var(--bg) 22px 44px,var(--accent2) 44px 66px,var(--bg) 66px 88px)}
body[data-theme=trades] .band{background:repeating-linear-gradient(-45deg,var(--accent) 0 16px,var(--bg) 16px 32px)}
body[data-theme=salon] .band,body[data-theme=restaurant] .band{height:6px}
section{padding:52px 0}
.kicker{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
section h2{font-size:clamp(38px,8vw,72px);margin-bottom:24px}
.board{border-top:1.5px solid var(--ink)}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:baseline;padding:16px 0;border-bottom:1px solid var(--line)}
.row b{font-weight:700;font-size:18px}
.row small{display:block;color:var(--mute);font-size:14px;font-weight:500}
.row .price{font-family:var(--display);font-weight:var(--dw);font-size:26px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.note{font-size:13px;color:var(--mute);margin-top:12px}
.score{display:flex;align-items:baseline;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.score strong{font-family:var(--display);font-size:84px;font-weight:var(--dw);line-height:.8}
.score em{font-style:normal;color:var(--mute);font-weight:600}
.reviews{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.rev{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.rev .s{color:#E6A700;letter-spacing:2px;font-size:14px}
.rev q{display:block;font-size:17px;font-weight:500;margin:10px 0 12px;quotes:none}
.rev span{font-size:13px;color:var(--mute)}
.visit{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.hours{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.hours td{padding:9px 0;border-bottom:1px solid var(--line)}
.hours td:last-child{text-align:right;font-weight:600}
.hours tr.today td{font-weight:800;color:var(--accent)}
.addr{font-weight:600;font-size:19px}
.contact{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.pitch{background:var(--accent2);color:#fff;border-radius:18px;padding:28px;margin-top:8px}
body[data-theme=cafe] .pitch{color:var(--ink)}
.pitch h3{font-size:30px;margin-bottom:8px}
.pitch p{opacity:.9;max-width:60ch}
footer{border-top:1.5px solid var(--line);padding:26px 0 36px;font-size:14px;color:var(--mute)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1.5px solid var(--line);display:flex;gap:10px;justify-content:center}
.dock .btn{flex:1;max-width:340px}
[hidden]{display:none!important}
@media (max-width:720px){.visit{grid-template-columns:1fr}}
@media (min-width:900px){body{padding-bottom:0}.dock{display:none}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body data-theme="barber">
<div class="pv">Website preview made for <b id="pvName"></b> by The Site Dept. Not live, and not affiliated with the business.</div>
<header class="bar"><div class="wrap">
  <a class="logo" href="#top" id="logo"></a>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText"></span></div>
</div></header>
<main id="top">
  <div class="wrap hero">
    <div class="meta" id="meta"></div>
    <h1 id="headline"></h1>
    <p class="lede" id="intro"></p>
    <div class="ctas"><a class="btn primary" id="cta1"></a><a class="btn" href="#services" id="cta2"></a></div>
  </div>
  <div class="band" aria-hidden="true"></div>
  <section id="services"><div class="wrap">
    <div class="kicker" id="svcKicker"></div><h2 id="svcTitle"></h2>
    <div class="board" id="svcList"></div>
    <p class="note" id="svcNote"></p>
  </div></section>
  <section id="reviews" style="padding-top:0"><div class="wrap">
    <div class="kicker">Reviews</div>
    <div class="score" id="score"></div>
    <div class="reviews" id="revList"></div>
  </div></section>
  <section id="visit" style="padding-top:0"><div class="wrap">
    <div class="kicker">Visit</div><h2 id="visitTitle">Find us</h2>
    <div class="visit">
      <table class="hours" aria-label="Opening hours"><tbody id="hours"></tbody></table>
      <div>
        <p class="addr" id="addr"></p>
        <div class="contact"><a class="btn" id="maps" target="_blank" rel="noopener">Get directions</a><a class="btn" id="call"></a></div>
      </div>
    </div>
    <div class="pitch"><h3>Like what you see?</h3><p id="pitchText"></p></div>
  </div></section>
</main>
<footer><div class="wrap" id="foot"></div></footer>
<div class="dock"><a class="btn primary" id="dock1"></a><a class="btn" id="dock2">Call</a></div>
<script id="data" type="application/json">{"theme": "trades", "name": "Tysoe Resto Shed", "shortName": "Tysoe Resto Shed", "rating": "", "reviewCount": "", "tagline": "Tysoe, Warwickshire", "headline": ["Classic cars.", "Brought back to life."], "intro": "Tysoe Resto Shed: car restoration specialists in Tysoe, Warwickshire. Tell us about your car and get a clear, honest quote.", "cta": {"label": "Get a free quote", "url": ""}, "secondaryLabel": "See services", "phone": "", "address": "Tysoe, Warwickshire", "servicesKicker": "What we do", "servicesTitle": "Services", "services": [{"name": "Full car restoration", "desc": "Ground-up, done properly", "price": ""}, {"name": "Bodywork & rust repair", "desc": "Panels, welding and prep", "price": ""}, {"name": "Mechanical work", "desc": "Getting it running right", "price": ""}, {"name": "Project assessment", "desc": "Tell us about the car and we'll advise", "price": ""}], "servicesNote": "Your real services, photos and prices go here.", "reviews": [], "hours": {}}</script>
<script>
(function(){
  const S=JSON.parse(document.getElementById("data").textContent);
  const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const $=id=>document.getElementById(id);
  document.body.dataset.theme=S.theme;
  $("pvName").textContent=S.name;$("logo").textContent=S.shortName||S.name;
  const m=[];if(S.rating)m.push(`<span class="stars">★★★★★ ${esc(S.rating)}</span>`);if(S.reviewCount)m.push(`<span>${esc(S.reviewCount)} Google reviews</span>`);if(S.tagline)m.push(`<span>${esc(S.tagline)}</span>`);
  $("meta").innerHTML=m.join("");
  $("headline").innerHTML=`${esc(S.headline[0])}<br><span>${esc(S.headline[1])}</span>`;
  $("intro").textContent=S.intro;
  const tel="tel:"+(S.phone||"").replace(/[^\d+]/g,"");
  const primary=S.cta||{label:"Call us",url:tel};
  [$("cta1"),$("dock1")].forEach(a=>{a.textContent=primary.label;a.href=primary.url||tel;if(/^https?:/.test(a.href)){a.target="_blank";a.rel="noopener"}});
  $("cta2").textContent=S.secondaryLabel||"See prices";
  $("dock2").href=tel;$("call").href=tel;$("call").textContent="Call "+(S.phone||"");if(!S.phone){$("call").hidden=true;$("dock2").hidden=true}
  $("svcKicker").textContent=S.servicesKicker||"Price list";$("svcTitle").textContent=S.servicesTitle||"What it costs";
  $("svcList").innerHTML=(S.services||[]).map(s=>`<div class="row"><div><b>${esc(s.name)}</b><small>${esc(s.desc||"")}</small></div><span class="price">${esc(s.price||"")}</span></div>`).join("");
  $("svcNote").textContent=S.servicesNote||"";
  const R=S.reviews||[];$("reviews").hidden=!R.length;
  $("score").innerHTML=S.rating?`<strong>${esc(S.rating)}</strong><em>from ${esc(S.reviewCount)} Google reviews</em>`:"";
  $("revList").innerHTML=R.map(r=>`<div class="rev"><div class="s">★★★★★</div><q>${esc(r.text)}</q><span>${esc(r.who||"Google review")}</span></div>`).join("");
  $("visitTitle").textContent=S.visitTitle||"Find us";
  $("addr").textContent=S.address||"";
  $("maps").href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(S.name+" "+(S.address||""));
  $("pitchText").textContent=`This is a free preview of what ${S.name}'s website could look like, made by The Site Dept. If you'd like it live, with your own photos, prices and booking link, just reply to the email.`;
  $("foot").textContent=`Preview by The Site Dept. for ${S.name}. Business details and reviews from public listings; prices and wording are placeholders until confirmed.`;
  document.title=`${S.name} | Website preview`;
  const days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],H=S.hours||{};
  const fmt=x=>{if(x>=23.98)return "midnight";const mm=Math.round((x%1)*60),hh=Math.floor(x)%24;return(((hh+11)%12)+1)+(mm?":"+String(mm).padStart(2,"0"):"")+(hh>=12?"pm":"am")};
  let now;try{now=new Date(new Date().toLocaleString("en-US",{timeZone:"Europe/London"}))}catch(e){now=new Date()}
  const d=now.getDay(),t=now.getHours()+now.getMinutes()/60,isOpen=i=>{const v=H[days[i]];return v&&v[1]>v[0]};
  if(!Object.keys(H).length){$("hours").innerHTML="";$("statusText").textContent="";}
  else{
    $("hours").innerHTML=[1,2,3,4,5,6,0].map(i=>{const v=H[days[i]];return`<tr class="${i===d?"today":""}"><td>${days[i]}</td><td>${isOpen(i)?fmt(v[0])+" – "+fmt(v[1]):"Closed"}</td></tr>`}).join("");
    let txt="";if(isOpen(d)&&t>=H[days[d]][0]&&t<H[days[d]][1]){txt="Open till "+fmt(H[days[d]][1]);$("dot").classList.add("open")}
    else if(isOpen(d)&&t<H[days[d]][0])txt="Opens "+fmt(H[days[d]][0]);
    else for(let k=1;k<=7;k++){const j=(d+k)%7;if(isOpen(j)){txt="Opens "+(k===1?"tomorrow ":days[j].slice(0,3)+" ")+fmt(H[days[j]][0]);break}}
    $("statusText").textContent=txt;
  }
})();
</script>
</body>
</html>
