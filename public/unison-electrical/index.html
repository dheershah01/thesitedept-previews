.cap{margin-top:12px;font-size:13px;color:var(--muted)}

.sticky{position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:20;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;border-radius:calc(var(--radius) + 8px);background:color-mix(in srgb,var(--dark) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,.25);transform:translateY(140%);transition:transform .35s}

.rv{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none}.hero .ph{animation:none}}

var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var ICON={phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>',arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 17 17 7M8 7h9v9"/></svg>',wa:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .5l-.3.5-.4.5c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l2 .9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>'};
var tel=D.phone?('tel:'+D.phone.replace(/\s+/g,'')):'';
var primary=D.cta&&D.cta.url?D.cta.url:'#quote';
var primaryLbl=(D.cta&&D.cta.label)||'Get in touch';
document.title=D.name+' | Website preview';
$('pv').innerHTML='Free website preview made for <b>'+esc(D.name)+'</b> by The Site Dept. Not the live site.';
// brand
$('brand').innerHTML=D.logo?'<img src="'+esc(D.logo)+'" alt="'+esc(D.name)+'">':'<span class="mark">'+esc((D.shortName||D.name).replace(/[^A-Za-z0-9 ]/g,'').split(' ').filter(Boolean).slice(0,2).map(function(w){return w[0]}).join('').toUpperCase())+'</span><span>'+esc(D.shortName||D.name)+'</span>';
$('navlinks').innerHTML='<a href="#services">'+esc(D.servicesTitle)+'</a>'+(D.reviews&&D.reviews.length?'<a href="#reviews">Reviews</a>':'')+'<a href="#contact">Contact</a>';
if(tel){$('navcall').href=tel;$('navcall').innerHTML=ICON.phone+'<span class="num">'+esc(D.phoneDisplay||D.phone)+'</span>'}else{$('navcall').href=primary;$('navcall').textContent=primaryLbl}
// hero
$('heroImg').src=D.photos.hero;$('heroImg').alt=D.photos.heroAlt||'';
if(D.photos.heroPos)$('heroImg').style.objectPosition=D.photos.heroPos;
$('loc').textContent=D.kicker;
$('h1').innerHTML=esc(D.headline[0])+'<em>'+esc(D.headline[1])+'</em>';
$('lead').textContent=D.intro;
var heroC='<a class="btn btn-a" href="'+esc(primary)+'">'+esc(primaryLbl)+'</a>';
if(tel&&primary!==tel)heroC+='<a class="btn btn-l" href="'+tel+'">'+ICON.phone+'Call '+esc(D.phoneDisplay||D.phone)+'</a>';
else heroC+='<a class="btn btn-l" href="#services">'+esc(D.secondaryLabel||'See more')+'</a>';
$('heroCtas').innerHTML=heroC;
if(D.rating){$('heroRate').innerHTML='<span class="stars">★★★★★</span><span><b>'+esc(D.rating)+'</b> from '+esc(D.reviewCount)+' Google reviews</span>'}else $('heroRate').remove();
// strip
$('strip').innerHTML=(D.facts||[]).slice(0,4).map(function(f){return '<div class="it"><b>'+esc(f[0])+'</b>'+esc(f[1])+'</div>'}).join('');
if(!(D.facts||[]).length)$('strip').parentNode.remove();
// services
$('svcK').textContent=D.servicesKicker;$('svcT').textContent=D.servicesTitle;$('svcP').textContent=D.servicesIntro||'';
$('svc').innerHTML=D.services.map(function(s,i){return '<li class="rv"><span class="n">'+(i<9?'0':'')+(i+1)+'</span><h3>'+esc(s.name)+'</h3>'+(s.price?'<span class="pr">'+esc(s.price)+'</span>':'<span class="ar">'+ICON.arrow+'</span>')+'<p>'+esc(s.desc)+'</p></li>'}).join('');
if(D.servicesNote)$('svcNote').textContent=D.servicesNote;else $('svcNote').remove();
// gallery
var g=D.photos.gallery||[];
if(g.length>=3){$('gal').innerHTML=g.slice(0,3).map(function(u){return '<figure><img loading="lazy" src="'+esc(u)+'" alt=""></figure>'}).join('');$('galCap').textContent=D.photos.caption||''}else $('gallerySec').remove();
// reviews
var R=D.reviews||[];
if(R.length){
 if(D.rating)$('big').innerHTML='<div class="num">'+esc(D.rating)+'</div><div class="lbl"><span class="stars">★★★★★</span><br>'+esc(D.reviewCount)+' reviews on Google</div>';else $('big').remove();
 $('revT').textContent=D.reviewsTitle||'Don’t just take our word for it.';
 $('revs').innerHTML=R.map(function(r){return '<div class="rev rv"><q>'+esc(r.text)+'</q><div class="who"><span>'+esc(r.who||'Google review')+'</span><span class="stars">★★★★★</span></div></div>'}).join('');
}else $('reviews').remove();
// steps
if(D.steps&&D.steps.length){$('howK').textContent=D.stepsKicker||'How it works';$('howT').textContent=D.stepsTitle||'Simple from start to finish.';
 $('steps').innerHTML=D.steps.map(function(s){return '<div class="step rv"><div><h3>'+esc(s[0])+'</h3><p>'+esc(s[1])+'</p></div></div>'}).join('')}else $('how').remove();
// contact
$('conT').textContent=D.contactTitle||'Get in touch.';$('conP').textContent=D.contactIntro||'';
var A='';
var days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
var H=D.hours||{};
function fmt(t){if(t>=23.98)return 'midnight';var h=Math.floor(t),m=Math.round((t-h)*60);var ap=h>=12?'pm':'am';var hh=h%12||12;return hh+(m?':'+(m<10?'0':'')+m:'')+ap}
if(Object.keys(H).length){
 var now=new Date(new Date().toLocaleString('en-US',{timeZone:'Europe/London'}));var di=(now.getDay()+6)%7;var cur=now.getHours()+now.getMinutes()/60;var td=H[days[di]];
 var isOpen=td&&td[1]>td[0]&&cur>=td[0]&&cur<td[1];
 A+='<h3>Opening hours</h3><div class="open'+(isOpen?'':' closed')+'"><i></i>'+(isOpen?'Open now · until '+fmt(td[1]):'Closed now')+'</div><ul class="hrs">'+days.map(function(d,i){var v=H[d];return '<li'+(i===di?' class="today"':'')+'><span>'+d+'</span><span>'+(!v?'—':(v[1]<=v[0]?'Closed':fmt(v[0])+' – '+fmt(v[1])))+'</span></li>'}).join('')+'</ul>';
}else if(D.areas&&D.areas.length){
 A+='<h3>Areas we cover</h3><div class="areas">'+D.areas.map(function(a){return '<span>'+esc(a)+'</span>'}).join('')+'</div>';
 if(D.aboutLine)A+='<p style="margin-top:22px;color:var(--muted);font-size:15px">'+esc(D.aboutLine)+'</p>';
}
var cl='';
if(tel)cl+='<a href="'+tel+'">Call<span>'+esc(D.phoneDisplay||D.phone)+'</span></a>';
if(D.whatsapp)cl+='<a href="https://wa.me/'+esc(D.whatsapp)+'">WhatsApp<span>Message us</span></a>';
if(D.email)cl+='<a href="mailto:'+esc(D.email)+'">Email<span>'+esc(D.email)+'</span></a>';
if(D.mapsQuery)cl+='<a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(D.mapsQuery)+'">Directions<span>'+esc(D.addressShort||'Open in Maps')+'</span></a>';
A+=(A?'<h3 style="margin-top:30px">Contact</h3>':'<h3>Contact</h3>')+'<div class="cl">'+cl+'</div>';
$('cardA').innerHTML=A;
$('cardB').id='quote';
$('quote').innerHTML='<h3>'+esc(D.formTitle||'Ask for a quote')+'</h3><form class="form" onsubmit="event.preventDefault();this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'"><input required placeholder="Your name" autocomplete="name"><input required placeholder="Phone or email"><textarea placeholder="'+esc(D.formPlaceholder||'What do you need?')+'"></textarea><button class="btn btn-a" type="submit">'+esc(D.formButton||'Send')+'</button></form><div class="fmsg">This is a preview, so nothing was sent. On the live site, messages from this form go straight to your inbox.</div>';
// cta band
$('ctaK').textContent=D.kicker;$('ctaT').textContent=D.ctaTitle||'Ready when you are.';
$('ctaB').innerHTML=(tel?'<a class="btn btn-a" href="'+tel+'">'+ICON.phone+'Call now</a>':'')+'<a class="btn btn-l" href="'+esc(primary)+'">'+esc(primaryLbl)+'</a>';
// footer
$('fn').textContent=D.shortName||D.name;
$('frow').innerHTML=[D.addressShort,D.phoneDisplay||D.phone,D.email,D.companyLine].filter(Boolean).map(function(x){return '<span>'+esc(x)+'</span>'}).join('')+'<span>© '+new Date().getFullYear()+'</span>';
// pitch
$('pitch').innerHTML='<h3>Like what you see?</h3><p>This is a free preview made for '+esc(D.name)+' by <b>The Site Dept.</b> It isn’t live, and it isn’t affiliated with the business. '+(D.photos.stock?'The photos are placeholders; we’d swap in your own. ':'')+'If you’d like it on your own domain, it can be live within a week, with your real prices, photos and details.</p><p>'+(D.pitchEmail?'Reply to the email this came with, or <a href="mailto:'+esc(D.pitchEmail)+'?subject='+encodeURIComponent('Website for '+D.name)+'">email '+esc(D.pitchName||'us')+'</a>.':'Just reply to the email this link came with.')+'</p>';
// sticky bar
$('sticky').innerHTML=(tel?'<a class="btn btn-l" href="'+tel+'">'+ICON.phone+'Call</a>':'<a class="btn btn-l" href="#contact">Contact</a>')+'<a class="btn btn-a" href="'+esc(primary)+'">'+esc(D.stickyLabel||primaryLbl)+'</a>';
var st=$('sticky');addEventListener('scroll',function(){st.classList.toggle('on',scrollY>window.innerHeight*.6)},{passive:true});
// reveal
var io='IntersectionObserver' in window?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{rootMargin:'0px 0px -8% 0px'}):null;
document.querySelectorAll('.rv').forEach(function(el){io?io.observe(el):el.classList.add('in')});
})();
</script>
</body>
</html>
